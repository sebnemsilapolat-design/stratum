<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Stratum</title>
<meta name="application-name" content="Stratum">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stratum">
<meta name="theme-color" content="#f0ece4">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="data:application/json,{
  %22name%22:%22Stratum%22,
  %22short_name%22:%22Stratum%22,
  %22description%22:%22Weekly planner%22,
  %22start_url%22:%22.%22,
  %22display%22:%22standalone%22,
  %22background_color%22:%22%23f0ece4%22,
  %22theme_color%22:%22%23f0ece4%22,
  %22icons%22:[{%22src%22:%22data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231a1714'/%3E%3Crect x='18' y='30' width='64' height='8' rx='4' fill='%23f0ece4'/%3E%3Crect x='18' y='46' width='64' height='8' rx='4' fill='%23f0ece4' opacity='.7'/%3E%3Crect x='18' y='62' width='40' height='8' rx='4' fill='%23f0ece4' opacity='.4'/%3E%3C/svg%3E%22,%22sizes%22:%22512x512%22,%22type%22:%22image/svg+xml%22,%22purpose%22:%22any maskable%22}]
}">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #f0ece4; color: #1a1714; min-height: 100vh; padding: 28px 32px 60px; font-size: 14px; }

  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 10px; }
  .header-left h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
  .header-left .sub { font-size: 0.78rem; color: #999; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .nav-btn { width: 28px; height: 28px; border: 1px solid #d4cfc7; background: #fff; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #555; transition: background 0.15s; }
  .nav-btn:hover { background: #e8e3da; }
  .date-range { font-size: 0.82rem; font-weight: 500; color: #333; }
  .this-week-btn { background: #fff; border: 1px solid #d4cfc7; border-radius: 6px; padding: 4px 12px; font-size: 0.78rem; font-weight: 500; cursor: pointer; color: #333; font-family: 'DM Sans', sans-serif; transition: background 0.15s; }
  .this-week-btn:hover { background: #e8e3da; }
  .save-indicator { font-size: 0.72rem; color: #5d8a5e; opacity: 0; transition: opacity 0.3s; }
  .save-indicator.show { opacity: 1; }
  .install-btn {
    display: none; align-items: center; gap: 6px;
    background: #1a1714; color: #fff; border: none; border-radius: 8px;
    padding: 5px 12px; font-size: 0.75rem; font-weight: 500;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: opacity 0.15s;
  }
  .install-btn:hover { opacity: 0.85; }

  .stats-row { display: flex; align-items: center; gap: 20px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat { font-size: 0.8rem; color: #555; }
  .stat span { font-weight: 600; color: #1a1714; }
  .legend { display: flex; align-items: center; gap: 12px; margin-left: auto; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; color: #666; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  .box { background: #fff; border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .box-title { font-size: 0.78rem; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }

  .prio-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #f7f5f0; border-radius: 7px; margin-bottom: 6px; }
  .prio-row.done { opacity: 0.45; }
  .prio-num { font-size: 0.72rem; color: #bbb; width: 16px; flex-shrink: 0; }
  .p-check { width: 16px; height: 16px; border-radius: 4px; border: 2px solid #ccc; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; background: #fff; transition: all 0.2s; }
  .prio-row.p-high .p-check { border-color: #c0392b; }
  .prio-row.p-medium .p-check { border-color: #d68910; }
  .prio-row.p-low .p-check { border-color: #5d8a5e; }
  .prio-row.p-high.done .p-check { background: #c0392b; border-color: #c0392b; }
  .prio-row.p-medium.done .p-check { background: #d68910; border-color: #d68910; }
  .prio-row.p-low.done .p-check { background: #5d8a5e; border-color: #5d8a5e; }
  .prio-row.done .p-check { background: #bbb; border-color: #bbb; }
  .prio-row.dragging { opacity: 0.4; }
  .prio-row.drag-over { border-top: 2px solid #2d6a9f; }
  .prio-row.prio-selected { outline: 2px solid #2d6a9f; outline-offset: 1px; }
  .p-select { width: 13px; height: 13px; border-radius: 3px; border: 1.5px solid #ccc; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #fff; background: #fff; transition: all 0.2s; opacity: 0; margin-left: 2px; }
  .prio-row:hover .p-select { opacity: 1; }
  .prio-row.prio-selected .p-select { opacity: 1; background: #2d6a9f; border-color: #2d6a9f; }
  .p-text { flex: 1; background: transparent; border: none; outline: none; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; color: #1a1714; }
  .p-text::placeholder { color: #ccc; }
  .prio-row.done .p-text { text-decoration: line-through; color: #bbb; }
  .p-dur { width: 52px; background: #eee; border: none; outline: none; font-family: 'DM Sans', sans-serif; font-size: 0.72rem; color: #777; border-radius: 5px; padding: 2px 6px; text-align: center; }
  .p-dur::placeholder { color: #bbb; }
  .ptag { font-size: 0.6rem; font-weight: 600; text-transform: uppercase; padding: 2px 7px; border-radius: 20px; cursor: pointer; flex-shrink: 0; user-select: none; letter-spacing: 0.06em; }
  .tag-high { background: #fdecea; color: #c0392b; }
  .tag-medium { background: #fef9e7; color: #d68910; }
  .tag-low { background: #eaf4ea; color: #5d8a5e; }
  .p-del { color: #ddd; cursor: pointer; font-size: 1rem; padding: 0 2px; transition: color 0.15s; flex-shrink: 0; }
  .p-del:hover { color: #999; }
  .add-btn { width: 100%; padding: 7px; font-size: 0.78rem; color: #bbb; background: none; border: 1px dashed #ddd; border-radius: 7px; cursor: pointer; font-family: 'DM Sans', sans-serif; margin-top: 4px; transition: all 0.15s; }
  .add-btn:hover { color: #555; border-color: #bbb; background: #f7f5f0; }

  .day-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 8px; margin-bottom: 20px; }
  .day-col { background: #fff; border-radius: 10px; display: flex; flex-direction: column; min-height: 200px; border: 2px solid transparent; }
  .day-col.today { background: #eaf4f0; border-color: #2a7d5a; }
  .day-head { padding: 10px 10px 6px; text-align: center; border-bottom: 1px solid rgba(0,0,0,0.06); }
  .day-name { font-weight: 600; font-size: 0.8rem; display: block; }
  .day-date { font-size: 0.68rem; color: #aaa; display: block; margin-top: 1px; }
  .day-col.today .day-name { color: #2a7d5a; }
  .day-col.today .day-date { color: #5aaa8a; }
  .day-total { font-size: 0.65rem; font-weight: 600; color: #2a7d5a; background: #e6f4ee; border-radius: 20px; padding: 1px 7px; margin-top: 4px; display: inline-block; text-align: center; }
  .day-total.empty { background: transparent; color: #ccc; }

  .task-list { flex: 1; padding: 7px 7px 4px; display: flex; flex-direction: column; gap: 4px; }
  .task-item { display: flex; align-items: flex-start; gap: 5px; padding: 5px 6px; border-radius: 6px; background: #f9f7f4; transition: background 0.15s; position: relative; }
  .task-item:hover { background: #f0ece4; }
  .task-item.done { opacity: 0.5; }
  .task-item.selected { outline: 2px solid #2d6a9f; outline-offset: 1px; }

  .t-select { position: absolute; top: 4px; right: 4px; width: 13px; height: 13px; border-radius: 3px; border: 1.5px solid #ccc; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #fff; background: #fff; transition: all 0.2s; opacity: 0; z-index: 1; pointer-events: none; }
  .task-item:hover .t-select { opacity: 1; pointer-events: all; }
  .task-item.selected .t-select { opacity: 1; pointer-events: all; background: #2d6a9f; border-color: #2d6a9f; }

  .t-check { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid #ccc; cursor: pointer; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #fff; background: #fff; transition: all 0.2s; }
  .task-item.p-high .t-check { border-color: #c0392b; }
  .task-item.p-medium .t-check { border-color: #d68910; }
  .task-item.p-low .t-check { border-color: #5d8a5e; }
  .task-item.p-high.done .t-check { background: #c0392b; border-color: #c0392b; }
  .task-item.p-medium.done .t-check { background: #d68910; border-color: #d68910; }
  .task-item.p-low.done .t-check { background: #5d8a5e; border-color: #5d8a5e; }
  .t-body { flex: 1; min-width: 0; }
  .t-input { width: 100%; background: transparent; border: none; outline: none; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; color: #1a1714; line-height: 1.4; white-space: pre-wrap; word-break: break-word; resize: none; overflow: hidden; min-height: 18px; }
  .t-input::placeholder { color: #ccc; }
  .task-item.done .t-input { text-decoration: line-through; color: #bbb; }
  .t-meta { display: flex; align-items: center; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
  .t-tag { font-size: 0.58rem; font-weight: 600; text-transform: uppercase; padding: 1px 5px; border-radius: 20px; cursor: pointer; user-select: none; letter-spacing: 0.05em; }
  .t-tag:hover { opacity: 0.7; }
  .t-dur { font-size: 0.65rem; color: #aaa; background: #f0ece4; border: none; outline: none; border-radius: 4px; padding: 1px 5px; width: 54px; font-family: 'DM Sans', sans-serif; text-align: center; }
  .t-dur::placeholder { color: #ccc; }
  .t-dur-label { font-size: 0.62rem; color: #ccc; }
  .t-done-dur { font-size: 0.6rem; color: #5d8a5e; background: #eaf4ea; border-radius: 4px; padding: 1px 5px; display: none; }
  .task-item.done .t-done-dur { display: inline; }
  .task-item.done .t-dur { display: none; }
  .task-item.done .t-dur-label { display: none; }
  .t-color-btn { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #ddd; cursor: pointer; flex-shrink: 0; margin-top: 2px; transition: transform 0.15s; background: #e8e3da; position: relative; z-index: 3; }
  .t-color-btn:hover { transform: scale(1.3); }
  .t-del { font-size: 0.75rem; color: #ddd; cursor: pointer; transition: color 0.15s; flex-shrink: 0; margin-top: 2px; }
  .t-del:hover { color: #e74c3c; }

  /* Drag handle */
  .t-drag { font-size: 0.75rem; color: #ccc; cursor: grab; flex-shrink: 0; padding: 0 2px; margin-top: 2px; user-select: none; line-height: 1; }
  .t-drag:active { cursor: grabbing; }
  .task-item.dragging { opacity: 0.4; }
  .task-item.drag-over { border-top: 2px solid #2d6a9f; }

  /* Duration display badge */
  .t-dur-display { font-size: 0.65rem; color: #2a7d5a; background: #e6f4ee; border-radius: 4px; padding: 1px 6px; font-weight: 600; display: none; }
  .t-dur-display.visible { display: inline; }

  .day-add { text-align: center; padding: 8px 4px; color: #ccc; cursor: pointer; font-size: 0.78rem; border-top: 1px dashed #eee; transition: color 0.15s; margin-top: auto; user-select: none; }
  .day-add:hover { color: #888; }
  .day-paste { display: none; text-align: center; padding: 6px 4px; color: #2d6a9f; cursor: pointer; font-size: 0.75rem; font-weight: 600; background: #e8f1f9; border-top: 1px solid #b8d4ed; transition: background 0.15s; user-select: none; }
  .day-paste:hover { background: #d0e8f7; }
  .day-paste.visible { display: block; }

  .copy-bar { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px); background: #1a1714; color: #fff; border-radius: 30px; padding: 10px 18px; display: flex; align-items: center; gap: 10px; font-size: 0.78rem; box-shadow: 0 4px 20px rgba(0,0,0,0.25); z-index: 8888; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; }
  .copy-bar.visible { opacity: 1; pointer-events: all; transform: translateX(-50%) translateY(0); }
  .copy-bar-count { font-weight: 600; color: #90cdf4; }
  .copy-bar-btn { color: #fff; border: none; border-radius: 20px; padding: 4px 12px; font-size: 0.75rem; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 500; transition: opacity 0.15s; }
  .copy-bar-btn:hover { opacity: 0.85; }
  .copy-bar-cancel { color: #aaa; cursor: pointer; font-size: 0.85rem; transition: color 0.15s; margin-left: 2px; }
  .copy-bar-cancel:hover { color: #fff; }

  .color-palette { position: fixed; z-index: 9999; background: #fff; border: 1px solid #e0dbd2; border-radius: 10px; padding: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); display: none; flex-direction: column; gap: 6px; min-width: 130px; }
  .color-palette.visible { display: flex; }
  .palette-swatches { display: flex; flex-wrap: wrap; gap: 5px; }
  .swatch { width: 18px; height: 18px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; transition: transform 0.12s, border-color 0.12s; }
  .swatch:hover { transform: scale(1.2); border-color: #aaa; }
  .swatch.active { border-color: #333; }
  .palette-clear { font-size: 0.65rem; color: #aaa; cursor: pointer; text-align: center; padding: 3px 2px; border-top: 1px solid #eee; margin-top: 2px; transition: color 0.15s; }
  .palette-clear:hover { color: #e74c3c; }

  .notes-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 8px; }
  .note-col { display: flex; flex-direction: column; gap: 5px; }
  .note-label { font-size: 0.7rem; font-weight: 600; color: #aaa; text-align: center; }
  .note-area { width: 100%; min-height: 40px; background: #f7f5f0; border: 1px solid transparent; border-radius: 7px; padding: 8px 10px; font-family: 'DM Sans', sans-serif; font-size: 0.76rem; color: #1a1714; resize: none; outline: none; line-height: 1.5; transition: border-color 0.15s; overflow: hidden; }
  .note-area:focus { border-color: #2a7d5a; }
  .note-area::placeholder { color: #ccc; }

  @media (max-width: 1100px) { .day-grid, .notes-grid { grid-template-columns: repeat(4,1fr); } }
  @media (max-width: 600px) { .day-grid, .notes-grid { grid-template-columns: repeat(2,1fr); } body { padding: 16px 12px 40px; } }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Stratum</h1>
    <div class="sub" id="yearSub"></div>
  </div>
  <div class="header-right">
    <button class="nav-btn" id="prevBtn">&#8592;</button>
    <span class="date-range" id="dateRange"></span>
    <button class="nav-btn" id="nextBtn">&#8594;</button>
    <button class="this-week-btn" id="thisWeekBtn">This week</button>

    <button class="install-btn" id="installBtn" onclick="if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;document.getElementById('installBtn').style.display='none';})}">
      ⬇ Install App
    </button>

<div class="stats-row">
  <div class="stat">Total: <span id="sTotal">0</span></div>

    <div class="legend-item"><div class="legend-dot" style="background:#9b2335"></div>YÖKDİL</div>
    <div class="legend-item"><div class="legend-dot" style="background:#2a7d5a"></div>Dietitian</div>
    <div class="legend-item"><div class="legend-dot" style="background:#2d6a9f"></div>IELTS</div>
    <div class="legend-item"><div class="legend-dot" style="background:#b85c2a"></div>Sport</div>
    <div class="legend-item"><div class="legend-dot" style="background:#7b5ea7"></div>Job Apps</div>
    <div class="legend-item"><div class="legend-dot" style="background:#c0392b"></div>High</div>
    <div class="legend-item"><div class="legend-dot" style="background:#d68910"></div>Med</div>

<div class="box">
  <div class="box-title">📌 This week's most important tasks</div>

<div class="day-grid" id="dayGrid"></div>

</div>

<div class="copy-bar" id="copyBar">

  <button class="copy-bar-btn" id="deleteSelectedBtn" style="background:#c0392b;">🗑 Delete</button>
  <button class="copy-bar-btn" id="deselectBtn" style="background:#555;">Deselect all</button>
  <span class="copy-bar-cancel" id="copyCancel">✕</span>
</div>

<script>
const STORAGE_KEY = 'stratum_template_v1';
const DAYS_FULL  = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DAYS_SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const PRIOS      = ['high','medium','low'];
const PRIO_LABEL = {high:'High', medium:'Medium', low:'Low'};
const TAG_CLASS  = {high:'tag-high', medium:'tag-medium', low:'tag-low'};
const PALETTE_COLORS = [
  '#fdecea','#fef9e7','#eaf4ea','#e8f1f9','#f3e8f9',
  '#fde8f0','#e8f4f9','#fff3e0','#f0f4e8','#f9f0e8',
  '#ffcccc','#ffe0a0','#c8e6c9','#b3d9f5','#d9b3f5',
  '#f5b3c8','#b3e5f5','#ffd180','#a5d6a7','#ffcc80',
];

// Task colors by category
const CAT_COLORS = {
  yokdil: '#fdecea',
  diet:   '#eaf4ea',
  ielts:  '#e8f1f9',
  sport:  '#fff3e0',
  job:    '#f3e8f9',
};

function uid() { return Math.random().toString(36).slice(2,9); }

let weekOffset = 0;
let appState = { priorities: [], weekData: {} };
let selectedTasks = [];
let clipboard = [];
let activeColorTask = null;
let dragSrc = null;

/* ── Storage ── */
function loadState() {
  try { const r = localStorage.getItem(STORAGE_KEY); if(r) appState = JSON.parse(r); } catch(e) {}
}
let saveTimer;
function saveState() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      const el = document.getElementById('saveInd');
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 1500);
    } catch(e) {}
  }, 400);
}

/* ── Week helpers ── */
function getWeekDates(off) {
  const today = new Date(); const dow = today.getDay();
  const mon = new Date(today);
  mon.setDate(today.getDate() - (dow===0?6:dow-1) + off*7);
  return Array.from({length:7}, (_,i) => { const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
}
function weekKey(off) {
  const d = getWeekDates(off)[0];
  const jan4 = new Date(d.getFullYear(),0,4);
  const wn = Math.ceil(((d-jan4)/86400000 + jan4.getDay()+1)/7);
  return `${d.getFullYear()}-W${String(wn).padStart(2,'0')}`;
}
function getWeekData(off) {
  const key = weekKey(off);
  if (!appState.weekData[key])
    appState.weekData[key] = { dayTasks: Array.from({length:7},()=>[]), notes: Array(7).fill('') };
  return appState.weekData[key];
}
function fmt(d) { return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
function isToday(d) { const t=new Date(); return d.getDate()===t.getDate()&&d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear(); }

/* ── Duration ── */
function parseDur(str) {
  if(!str) return 0; str=str.toString().trim().toLowerCase();
  const hm=str.match(/(\d+\.?\d*)h(?:r)?(?:\s*(\d+)m?)?/);
  const mo=str.match(/^(\d+\.?\d*)m/); const num=str.match(/^(\d+)$/);
  if(hm) return Math.round(parseFloat(hm[1])*60+(hm[2]?parseInt(hm[2]):0));
  if(mo) return Math.round(parseFloat(mo[1])); if(num) return parseInt(num[1]); return 0;
}
function fmtDur(m) { if(!m) return ''; return m<60?`${m}m`:(m%60?`${Math.floor(m/60)}h ${m%60}m`:`${Math.floor(m/60)}h`); }

  document.getElementById('sDone').textContent=done.length;
  document.getElementById('sLeft').textContent=all.length-done.length;
  document.getElementById('sPlanned').textContent=totalMin?fmtDur(totalMin):'—';
  document.getElementById('sDoneMin').textContent=doneMin?fmtDur(doneMin):'—';
}

/* ── Priorities ── */
let selectedPrios = [];
let prioDragSrc = null;

function toggleSelectPrio(p) {
  const idx = selectedPrios.findIndex(s => s === p);
  if(idx > -1) selectedPrios.splice(idx,1); else selectedPrios.push(p);
  updateCopyBar();
  document.querySelectorAll('.prio-row').forEach(el => {

      el.classList.toggle('prio-selected', isSel);

      if(selEl) selEl.textContent = isSel ? '✓' : '';

function renderPrios() {
  const list=document.getElementById('prioList'); list.innerHTML='';
  appState.priorities.forEach((p,i) => {
    const row=document.createElement('div');
    row._prio = p;
    const isSel = selectedPrios.includes(p);
    row.className=`prio-row p-${p.priority} ${p.done?'done':''} ${isSel?'prio-selected':''}`;
    if(p.color) row.style.background=p.color;
    row.draggable=true;

    // Drag events
    row.addEventListener('dragstart', e=>{ prioDragSrc=p; setTimeout(()=>row.classList.add('dragging'),0); e.dataTransfer.effectAllowed='move'; });
    row.addEventListener('dragend', ()=>{ row.classList.remove('dragging'); document.querySelectorAll('.prio-row').forEach(r=>r.classList.remove('drag-over')); });
    row.addEventListener('dragover', e=>{ e.preventDefault(); document.querySelectorAll('.prio-row').forEach(r=>r.classList.remove('drag-over')); if(prioDragSrc&&prioDragSrc!==p) row.classList.add('drag-over'); });
    row.addEventListener('drop', e=>{ e.preventDefault(); row.classList.remove('drag-over'); if(!prioDragSrc||prioDragSrc===p) return; const arr=appState.priorities; const fi=arr.indexOf(prioDragSrc); const ti=arr.indexOf(p); if(fi<0||ti<0) return; arr.splice(fi,1); arr.splice(ti,0,prioDragSrc); prioDragSrc=null; saveState(); renderPrios(); });

    // Drag handle
    const drag=document.createElement('span'); drag.className='t-drag'; drag.textContent='⠿'; drag.title='Drag to reorder';

    const num=document.createElement('span'); num.className='prio-num'; num.textContent=(i+1)+'.';

    const chk=document.createElement('div'); chk.className='p-check'; chk.textContent=p.done?'✓':'';
    chk.onclick=()=>{ p.done=!p.done; saveState(); renderPrios(); renderStats(); };

    // Text input with capitalize
    const inp=document.createElement('input'); inp.type='text'; inp.className='p-text';
    inp.placeholder='Important task...'; inp.value=p.text||''; inp.disabled=p.done;
    inp.oninput=e=>{
      const val=e.target.value; const pos=e.target.selectionStart;
      const cap=val.length>0?val[0].toUpperCase()+val.slice(1):val;
      if(cap!==val){ e.target.value=cap; e.target.selectionStart=e.target.selectionEnd=pos; }
      p.text=e.target.value; saveState(); renderStats();
    };
    inp.onkeydown=e=>{ if(e.key==='Enter') addPrio(); };

    // Duration with auto-format
    const durInp=document.createElement('input'); durInp.type='text'; durInp.className='p-dur';
    durInp.placeholder='45m / 1h';
    durInp.value=p.duration?(parseDur(p.duration)?fmtDur(parseDur(p.duration)):p.duration):'';
    durInp.oninput=e=>{ p.duration=e.target.value; saveState(); renderStats(); };
    durInp.onblur=e=>{ const m=parseDur(e.target.value); if(m){ durInp.value=fmtDur(m); p.duration=fmtDur(m); saveState(); renderStats(); } };

    // Priority tag
    const tag=document.createElement('span'); tag.className=`ptag ${TAG_CLASS[p.priority]}`; tag.textContent=PRIO_LABEL[p.priority];
    tag.onclick=()=>{ p.priority=PRIOS[(PRIOS.indexOf(p.priority)+1)%3]; saveState(); renderPrios(); };

    // Color button
    const colorBtn=document.createElement('div'); colorBtn.className='t-color-btn'; colorBtn.title='Set color';
    const hasColor = p.color && p.color !== 'undefined' && p.color !== '';
    colorBtn.style.background = hasColor ? p.color : '#e8e3da';
    colorBtn.style.borderColor = hasColor ? p.color : '#ddd';
    colorBtn.style.boxShadow = hasColor ? `0 0 0 1.5px ${p.color}` : 'none';
    colorBtn.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); showPalette(e,p,colorBtn); });
    colorBtn.addEventListener('dragstart', e=>{ e.preventDefault(); e.stopPropagation(); });

    // Select checkbox
    const sel=document.createElement('div'); sel.className='p-select';
    sel.textContent=isSel?'✓':'';
    sel.onclick=e=>{ e.stopPropagation(); e.preventDefault(); toggleSelectPrio(p); };

    // Delete
    const del=document.createElement('span'); del.className='p-del'; del.textContent='×';
    del.onclick=()=>{ appState.priorities.splice(i,1); saveState(); renderPrios(); renderStats(); };

    row.append(drag,num,chk,inp,durInp,tag,colorBtn,del);
    row.appendChild(sel);
    list.appendChild(row);
  });
}

function initPalette() {
  const sw=document.getElementById('paletteSwatches');
  PALETTE_COLORS.forEach(color => {
    const s=document.createElement('div'); s.className='swatch'; s.style.background=color;
    s.onmousedown=e=>{ e.preventDefault(); e.stopPropagation();
      if(!activeColorTask) return;
      activeColorTask.task.color=color;
      if(activeColorTask.btn){
        activeColorTask.btn.style.background=color;
        activeColorTask.btn.style.borderColor=color;
        activeColorTask.btn.style.boxShadow=`0 0 0 1.5px ${color}`;
      }
      // Update background of the row/item directly
      const isFromPrio = appState.priorities.includes(activeColorTask.task);
      saveState(); hidePalette();
      if(isFromPrio) renderPrios(); else renderDayGrid();
    };
    sw.appendChild(s);
  });
  document.getElementById('paletteClear').onmousedown=e=>{ e.preventDefault(); e.stopPropagation();
    if(!activeColorTask) return;
    delete activeColorTask.task.color;
    if(activeColorTask.btn){
        activeColorTask.btn.style.background='#e8e3da';
        activeColorTask.btn.style.borderColor='#ddd';
        activeColorTask.btn.style.boxShadow='none';
      }
    const isFromPrio = appState.priorities.includes(activeColorTask.task);
    saveState(); hidePalette();
    if(isFromPrio) renderPrios(); else renderDayGrid();
  };
}
function showPalette(e, task, btn) {
  e.stopPropagation();
  e.preventDefault();
  const palette = document.getElementById('colorPalette');
  // Toggle if same task
  if (activeColorTask && activeColorTask.task === task && palette.classList.contains('visible')) {
    hidePalette(); return;
  }
  activeColorTask = {task, btn};
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.style.background === task.color));
  const rect = btn.getBoundingClientRect();
  palette.style.top = (rect.bottom + window.scrollY + 6) + 'px';
  palette.style.left = Math.min(rect.left + window.scrollX, window.innerWidth - 150) + 'px';
  palette.classList.add('visible');
  // Prevent the document click from closing it immediately
  setTimeout(() => { paletteJustOpened = false; }, 0);
  paletteJustOpened = true;
}
function hidePalette() {
  document.getElementById('colorPalette').classList.remove('visible');
  activeColorTask = null;
}

let paletteJustOpened = false;
document.addEventListener('click', e => {
  if (paletteJustOpened) return;

});

function toggleSelect(task,di) {

  updateCopyBar();

function updateCopyBar() {

function dayDoneMins(di)  { return getWeekData(weekOffset).dayTasks[di].filter(t=>t.done).reduce((s,t)=>s+parseDur(t.duration),0); }
function updateDayBadge(di) {
  const badges=document.querySelectorAll('.day-total'); if(!badges[di]) return;
  const total=dayTotalMins(di),done=dayDoneMins(di);
  badges[di].className=`day-total${total===0?' empty':''}`;

function makeTaskEl(di,task,wd) {
  const isSelected=selectedTasks.some(s=>s.task===task);
  const item=document.createElement('div');
  item._task=task; // reference for toggleSelect
  item.className=`task-item p-${task.priority}${task.done?' done':''}${isSelected?' selected':''}`;
  const hasTaskColor=task.color&&task.color!=='undefined'&&task.color!==''; if(hasTaskColor) item.style.background=task.color;
  item.draggable=true;

  /* Drag events */
  item.addEventListener('dragstart', e=>{
    dragSrc={di, task};
    setTimeout(()=>item.classList.add('dragging'),0);
    e.dataTransfer.effectAllowed='move';
  });
  item.addEventListener('dragend', ()=>{
    item.classList.remove('dragging');
    document.querySelectorAll('.task-item').forEach(el=>el.classList.remove('drag-over'));
  });
  item.addEventListener('dragover', e=>{
    e.preventDefault(); e.dataTransfer.dropEffect='move';
    document.querySelectorAll('.task-item').forEach(el=>el.classList.remove('drag-over'));
    if(dragSrc && dragSrc.task!==task) item.classList.add('drag-over');
  });
  item.addEventListener('drop', e=>{
    e.preventDefault(); e.stopPropagation();
    item.classList.remove('drag-over');
    if(!dragSrc || dragSrc.task===task || dragSrc.di!==di) return;
    const arr=wd.dayTasks[di];
    const fromIdx=arr.indexOf(dragSrc.task);
    const toIdx=arr.indexOf(task);
    if(fromIdx<0||toIdx<0) return;
    arr.splice(fromIdx,1); arr.splice(toIdx,0,dragSrc.task);
    dragSrc=null; saveState(); renderDayGrid();
  });

  const sel=document.createElement('div'); sel.className='t-select'; sel.textContent=isSelected?'✓':'';
  sel.onclick=e=>{ e.stopPropagation(); e.preventDefault(); toggleSelect(task,di); };

  /* Drag handle */
  const drag=document.createElement('span'); drag.className='t-drag'; drag.textContent='⠿';
  drag.title='Drag to reorder';
  drag.addEventListener('mousedown', ()=>{ item.draggable=true; });

  const chk=document.createElement('div'); chk.className='t-check'; chk.textContent=task.done?'✓':'';
  chk.onclick=()=>{ task.done=!task.done; saveState(); renderDayGrid(); renderStats(); };

  const body=document.createElement('div'); body.className='t-body';
  const inp=document.createElement('textarea'); inp.className='t-input';
  inp.placeholder='Task...'; inp.value=task.text||''; inp.disabled=task.done;
  inp.rows=1;
  inp.style.textTransform='none';
  function autoResize() { inp.style.height='auto'; inp.style.height=inp.scrollHeight+'px'; }
  inp.oninput=e=>{
    // Auto-capitalize first letter of each line
    const val=e.target.value;
    const pos=e.target.selectionStart;
    const lines=val.split('\n').map(l=>l.length>0?l[0].toUpperCase()+l.slice(1):l);
    const newVal=lines.join('\n');
    if(newVal!==val){ e.target.value=newVal; e.target.selectionStart=e.target.selectionEnd=pos; }
    task.text=e.target.value; saveState(); renderStats(); autoResize();
  };
  inp.onkeydown=e=>{
    if(e.key==='Enter'){e.preventDefault();
      const start=inp.selectionStart; const val=inp.value;
      inp.value=val.slice(0,start)+'\n'+val.slice(start);
      inp.selectionStart=inp.selectionEnd=start+1;
      task.text=inp.value; saveState(); autoResize(); return;
    }
    if(e.key==='Backspace'&&!task.text){const idx=wd.dayTasks[di].indexOf(task);if(idx>-1){wd.dayTasks[di].splice(idx,1);saveState();renderDayGrid();renderStats();}}
  };
  setTimeout(autoResize, 0);

  const meta=document.createElement('div'); meta.className='t-meta';
  const tag=document.createElement('span'); tag.className=`t-tag ${TAG_CLASS[task.priority]}`; tag.textContent=PRIO_LABEL[task.priority];
  tag.onclick=()=>{ task.priority=PRIOS[(PRIOS.indexOf(task.priority)+1)%3]; saveState(); renderDayGrid(); };

  const durLabel=document.createElement('span'); durLabel.className='t-dur-label'; durLabel.textContent='⏱';

  /* Duration input — auto-formats on blur */
  const durInp=document.createElement('input'); durInp.type='text'; durInp.className='t-dur';
  durInp.placeholder='30m';
  const fmtd = task.duration ? (parseDur(task.duration) ? fmtDur(parseDur(task.duration)) : task.duration) : '';
  durInp.value = fmtd;
  durInp.oninput=e=>{ task.duration=e.target.value; saveState(); updateDayBadge(di); renderStats(); };
  durInp.onblur=e=>{
    const mins=parseDur(e.target.value);
    if(mins){ const fmt=fmtDur(mins); durInp.value=fmt; task.duration=fmt; saveState(); updateDayBadge(di); renderStats(); }
  };

  const doneDur=document.createElement('span'); doneDur.className='t-done-dur';
  const mins=parseDur(task.duration); doneDur.textContent=mins?'⏱ '+fmtDur(mins):'';
  const colorBtn=document.createElement('div'); colorBtn.className='t-color-btn'; colorBtn.title='Set color';
  const hasColor = task.color && task.color !== 'undefined' && task.color !== '';
  colorBtn.style.background = hasColor ? task.color : '#e8e3da';
  colorBtn.style.borderColor = hasColor ? task.color : '#ddd';
  colorBtn.style.boxShadow = hasColor ? `0 0 0 1.5px ${task.color}` : 'none';
  colorBtn.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); showPalette(e, task, colorBtn); });
  colorBtn.addEventListener('dragstart', e=>{ e.preventDefault(); e.stopPropagation(); });
  meta.append(tag,durLabel,durInp,doneDur,colorBtn);
  body.append(inp,meta);

  const del=document.createElement('span'); del.className='t-del'; del.textContent='×';
  del.onclick=()=>{ const idx=wd.dayTasks[di].indexOf(task); if(idx>-1){wd.dayTasks[di].splice(idx,1);saveState();renderDayGrid();renderStats();} };

  item.append(drag,chk,body,del); item.appendChild(sel);
  return item;
}

function addDayTask(di) {
  const wd=getWeekData(weekOffset);

function renderDayGrid() {

    const badge=document.createElement('span'); badge.className=`day-total${totalMins===0?' empty':''}`;
    badge.textContent=totalMins>0?(doneMins>0?`${fmtDur(doneMins)} / ${fmtDur(totalMins)}`:fmtDur(totalMins)):'—';
    head.append(nameEl,dateEl,badge); col.appendChild(head);
    const list=document.createElement('div'); list.className='task-list';
    wd.dayTasks[di].forEach(task=>list.appendChild(makeTaskEl(di,task,wd)));

    grid.appendChild(col);
  });
}

  const swCode = `
    const CACHE = 'stratum-v1';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/'])));
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(caches.keys().then(keys =>
        Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))
      ));
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
    });
  `;
  const blob = new Blob([swCode], {type:'application/javascript'});

// ── Install prompt (Android Chrome) ──
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  // Show install button
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'flex';
});
window.addEventListener('appinstalled', () => {
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'none';
  deferredPrompt = null;
});
</script>
</body>
</html>
